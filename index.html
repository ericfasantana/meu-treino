<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
</head>
<body>
<style>
:root {
  --bg:  #0B0C0E;
  --s1:  #131416;
  --s2:  #1C1D22;
  --s3:  #26272C;
  --t1:  #F0EFE9;
  --t2:  #8F8F9A;
  --t3:  #45454E;
  --ac:  #3CC870;
  --acd: #1A5C35;
  --acb: #0A2015;
  --bd:  #1E1F24;
  --red: #E05050;
  --nav: 62px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  height: 100%; background: var(--bg);
}
body {
  height: 100%; overflow: hidden; background: var(--bg);
  color: var(--t1); font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  color-scheme: dark;
}

/* SCROLL PANELS */
.panel {
  position: fixed; top: 0; left: 0; right: 0;
  bottom: calc(var(--nav) + var(--sab));
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: none; padding-top: calc(var(--sat) + 58px);
  background: var(--bg);
}
.panel.active { display: block; }
.panel-content { padding: 10px 0 32px; }

/* APP BAR */
.app-bar {
  position: fixed; top: var(--sat); left: 0; right: 0; z-index: 60;
  background: var(--bg); border-bottom: 1px solid var(--bd);
  padding: 12px 18px;
}
.bar-row { display: flex; justify-content: space-between; align-items: center; }
.bar-eyebrow {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--ac); margin-bottom: 1px;
}
.bar-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.bar-btn {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 10px;
  padding: 6px 13px; color: var(--t2); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.bar-btn:active { opacity: 0.7; }
.bar-btn.primary { background: var(--ac); border-color: var(--ac); color: #fff; }

/* PROGRESS BAR */
.prog-wrap { margin-top: 10px; }
.prog-track { height: 3px; background: var(--s3); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--ac); transition: width 0.5s ease; }
.prog-text { font-size: 12px; color: var(--t2); margin-top: 6px; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav) + var(--sab)); background: var(--s1);
  border-top: 1px solid var(--bd); display: flex;
  padding-bottom: var(--sab); z-index: 60;
}
.nav-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; color: var(--t3);
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; transition: color 0.15s; user-select: none;
}
.nav-tab svg { width: 21px; height: 21px; stroke-width: 1.75; }
.nav-tab.active { color: var(--ac); }

/* SECTION LABEL */
.sec-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--t2); padding: 18px 18px 8px;
}

/* EXERCISE CARD */
.ex-card {
  margin: 0 14px 9px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 18px; overflow: hidden;
  transition: opacity 0.35s, border-color 0.35s;
}
.ex-card.done { opacity: 0.42; border-color: var(--acd); }
.ex-card.done .ex-name { text-decoration: line-through; text-decoration-color: var(--acd); }
.ex-body { padding: 15px 15px 13px; }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.ex-name { font-size: 15.5px; font-weight: 700; flex: 1; line-height: 1.25; }
.ex-chip {
  background: var(--acb); color: var(--ac); font-size: 12.5px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.ex-note { font-size: 12px; color: var(--t2); margin-bottom: 13px; line-height: 1.4; }
.sets-row { display: flex; gap: 6px; }
.set-btn {
  flex: 1; height: 46px; border-radius: 11px; border: 2px solid var(--bd);
  background: var(--s2); color: var(--t2); font-size: 13.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: all 0.15s;
  user-select: none; font-family: inherit; position: relative;
}
.set-btn:active { transform: scale(0.91); }
.set-btn.s-next { border-color: var(--ac); color: var(--ac); background: var(--acb); }
.set-btn.s-done { background: var(--ac); border-color: var(--ac); color: #fff; }
.set-btn.s-done::after { content: '✓'; position: absolute; font-size: 15px; }
.set-btn.s-done > * { display: none; }
.reps-sub { font-size: 11.5px; color: var(--t2); text-align: center; margin-top: 8px; font-weight: 500; }

/* TIMER SHEET */
.timer-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--s1); border-top: 1px solid var(--bd);
  border-radius: 22px 22px 0 0; padding: 18px 22px;
  padding-bottom: calc(var(--sab) + var(--nav) + 18px);
  transform: translateY(110%); transition: transform 0.4s cubic-bezier(0.32,1.15,0.6,1);
}
.timer-sheet.show { transform: translateY(0); }
.timer-handle { width: 36px; height: 4px; background: var(--s3); border-radius: 2px; margin: 0 auto 16px; }
.timer-body { display: flex; align-items: center; gap: 18px; }
.timer-left { flex: 1; }
.timer-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--t2); }
.timer-num { font-size: 54px; font-weight: 800; color: var(--ac); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
.timer-sub { font-size: 12px; color: var(--t2); margin-top: 4px; }
.timer-ring { width: 70px; height: 70px; flex-shrink: 0; }
.ring-bg { fill: none; stroke: var(--s3); stroke-width: 5.5; }
.ring-fg { fill: none; stroke: var(--ac); stroke-width: 5.5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }
.skip-btn {
  display: block; width: 100%; margin-top: 14px; background: var(--s2);
  border: 1px solid var(--bd); border-radius: 13px; padding: 14px;
  color: var(--t1); font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.skip-btn:active { opacity: 0.7; }

/* NOTE MODAL */
.modal-bg {
  position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.75);
  display: flex; align-items: flex-end;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-bg.show { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--s1); width: 100%; border-radius: 22px 22px 0 0;
  padding: 20px 20px calc(var(--sab) + 24px);
  transform: translateY(40px); transition: transform 0.35s ease;
  border-top: 1px solid var(--bd);
}
.modal-bg.show .modal-box { transform: translateY(0); }
.modal-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
.note-area {
  width: 100%; background: var(--s2); border: 1px solid var(--bd);
  border-radius: 13px; padding: 13px; color: var(--t1);
  font-family: inherit; font-size: 14px; line-height: 1.5;
  resize: none; height: 110px; outline: none;
}
.note-area:focus { border-color: var(--ac); }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-btn {
  flex: 1; padding: 14px; border-radius: 13px; font-size: 15px;
  font-weight: 700; cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent; border: none;
}
.modal-btn.secondary { background: var(--s2); color: var(--t1); border: 1px solid var(--bd); }
.modal-btn.accent { background: var(--ac); color: #fff; }
.modal-btn:active { opacity: 0.8; }

/* CALENDAR */
.cal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 10px; }
.cal-month { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; }
.cal-nav { display: flex; gap: 4px; }
.cal-arrow {
  width: 34px; height: 34px; background: var(--s2); border: 1px solid var(--bd);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; font-size: 15px; color: var(--t2);
}
.cal-arrow:active { opacity: 0.6; }
.cal-grid { padding: 0 14px 6px; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-dow-cell { text-align: center; font-size: 11px; font-weight: 700; color: var(--t3); padding: 4px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day {
  aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 600; color: var(--t2);
  cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative;
}
.cal-day.today { color: var(--t1); background: var(--s2); }
.cal-day.trained { background: var(--acb); color: var(--ac); font-weight: 800; }
.cal-day.trained::after {
  content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--ac);
}
.cal-day.trained.today { background: var(--acd); }
.cal-day:empty { cursor: default; }
.cal-day-detail {
  margin: 6px 14px 14px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; padding: 14px 16px;
}
.cal-detail-date { font-size: 12px; font-weight: 700; color: var(--ac); margin-bottom: 6px; }
.cal-detail-note { font-size: 14px; color: var(--t2); line-height: 1.5; }

/* STATS ROW */
.stats-row { display: flex; padding: 0 14px 6px; gap: 8px; }
.stat-card {
  flex: 1; background: var(--s1); border: 1px solid var(--bd); border-radius: 14px;
  padding: 12px; text-align: center;
}
.stat-val { font-size: 22px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
.stat-lbl { font-size: 11px; color: var(--t2); font-weight: 600; margin-top: 1px; }

/* EDIT FORM */
.edit-field {
  margin: 0 14px 10px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; overflow: hidden;
}
.field-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--bd); gap: 12px;
}
.field-row:last-child { border-bottom: none; }
.field-label { font-size: 14px; font-weight: 600; color: var(--t1); flex-shrink: 0; }
.field-sub { font-size: 12px; color: var(--t2); margin-top: 1px; }
.field-input {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 9px;
  padding: 7px 11px; color: var(--t1); font-family: inherit; font-size: 14px;
  font-weight: 600; outline: none; width: 100%; max-width: 200px; text-align: right;
}
.field-input:focus { border-color: var(--ac); }
.field-input.wide { max-width: 100%; text-align: left; flex: 1; }
.rest-row { padding: 14px 16px; }
.rest-label-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
.rest-val { font-size: 17px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
input[type=range] {
  width: 100%; accent-color: var(--ac); cursor: pointer; height: 4px;
}

/* EX EDIT CARD */
.ex-edit-card {
  margin: 0 14px 9px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; overflow: hidden;
}
.ex-edit-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--bd); background: var(--s2);
}
.ex-edit-num { font-size: 12px; font-weight: 800; color: var(--ac); min-width: 20px; }
.ex-edit-name-input {
  flex: 1; background: transparent; border: none; color: var(--t1);
  font-family: inherit; font-size: 14px; font-weight: 700; outline: none; min-width: 0;
}
.ex-edit-name-input::placeholder { color: var(--t3); }
.del-btn {
  width: 28px; height: 28px; border-radius: 8px; background: transparent;
  border: 1px solid var(--bd); color: var(--red); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0; font-family: inherit;
}
.del-btn:active { opacity: 0.6; }
.ex-edit-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.ex-edit-field { padding: 10px 14px; border-right: 1px solid var(--bd); }
.ex-edit-field:last-child { border-right: none; }
.ex-ef-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--t3); margin-bottom: 5px; }
.ex-ef-input {
  width: 100%; background: var(--s2); border: 1px solid var(--bd); border-radius: 7px;
  padding: 6px 8px; color: var(--t1); font-family: inherit; font-size: 13px;
  font-weight: 600; outline: none; text-align: center;
}
.ex-ef-input:focus { border-color: var(--ac); }
.add-ex-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 4px 14px 16px; padding: 14px; background: var(--acb);
  border: 1.5px dashed var(--acd); border-radius: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; color: var(--ac);
  font-size: 14px; font-weight: 700; font-family: inherit;
}
.add-ex-btn:active { opacity: 0.7; }

/* HISTORY */
.hist-item {
  margin: 0 14px 10px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; overflow: hidden;
}
.hist-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 15px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.hist-date { font-size: 13.5px; font-weight: 800; }
.hist-meta { font-size: 12px; color: var(--t2); margin-top: 2px; }
.hist-badge {
  background: var(--acb); color: var(--ac); font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
}
.hist-note {
  padding: 0 15px 13px; font-size: 13px; color: var(--t2); line-height: 1.5;
  border-top: 1px solid var(--bd); padding-top: 11px;
  display: none;
}
.hist-note.open { display: block; }

/* DONE OVERLAY */
.done-overlay {
  position: fixed; inset: 0; z-index: 400; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 28px; opacity: 0; pointer-events: none; transition: opacity 0.5s;
  padding-top: calc(var(--sat) + 40px);
}
.done-overlay.show { opacity: 1; pointer-events: auto; }
.done-icon {
  width: 80px; height: 80px; border-radius: 50%; background: var(--acb);
  border: 2px solid var(--acd); display: flex; align-items: center;
  justify-content: center; margin-bottom: 22px;
}
.done-title { font-size: 28px; font-weight: 800; text-align: center; letter-spacing: -0.5px; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: var(--t2); text-align: center; line-height: 1.6; margin-bottom: 28px; }
.done-stats-row {
  display: flex; gap: 20px; margin-bottom: 32px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: 18px;
  padding: 18px 28px;
}
.d-stat { text-align: center; }
.d-stat-val { font-size: 24px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
.d-stat-lbl { font-size: 11px; color: var(--t2); margin-top: 2px; font-weight: 600; }
.done-note-area {
  width: 100%; max-width: 380px; background: var(--s2); border: 1px solid var(--bd);
  border-radius: 14px; padding: 13px; color: var(--t1); font-family: inherit;
  font-size: 14px; line-height: 1.5; resize: none; height: 90px;
  outline: none; margin-bottom: 16px;
}
.done-note-area:focus { border-color: var(--ac); }
.done-finish-btn {
  width: 100%; max-width: 380px; background: var(--ac); border: none;
  border-radius: 16px; padding: 17px; color: #fff; font-size: 17px;
  font-weight: 800; cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.done-finish-btn:active { opacity: 0.85; }

/* EMPTY STATE */
.empty { text-align: center; padding: 48px 24px; color: var(--t2); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; line-height: 1.6; }
</style>

<!-- App panels -->
<div class="panel active" id="panel-hoje"><div class="panel-content" id="hoje-content"></div></div>
<div class="panel" id="panel-semana"><div class="panel-content" id="semana-content"></div></div>
<div class="panel" id="panel-editar"><div class="panel-content" id="editar-content"></div></div>
<div class="panel" id="panel-historico"><div class="panel-content" id="historico-content"></div></div>

<!-- Fixed header -->
<header class="app-bar" id="app-bar">
  <div class="bar-row">
    <div>
      <div class="bar-eyebrow" id="bar-eyebrow">Hoje</div>
      <div class="bar-title" id="bar-title">Full Body 4×</div>
    </div>
    <div id="bar-right"></div>
  </div>
  <div id="bar-extra"></div>
</header>

<!-- Bottom nav -->
<nav class="bottom-nav" id="bnav">
  <button class="nav-tab active" data-tab="hoje">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h7"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
    Hoje
  </button>
  <button class="nav-tab" data-tab="semana">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Calendário
  </button>
  <button class="nav-tab" data-tab="editar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
    Editar
  </button>
  <button class="nav-tab" data-tab="historico">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Histórico
  </button>
</nav>

<!-- Timer sheet -->
<div class="timer-sheet" id="timer-sheet">
  <div class="timer-handle"></div>
  <div class="timer-body">
    <div class="timer-left">
      <div class="timer-label">Descansando</div>
      <div class="timer-num" id="timer-num">75</div>
      <div class="timer-sub" id="timer-sub"></div>
    </div>
    <svg class="timer-ring" viewBox="0 0 70 70">
      <circle class="ring-bg" cx="35" cy="35" r="29"/>
      <circle class="ring-fg" id="ring-fg" cx="35" cy="35" r="29" stroke-dasharray="182.2" stroke-dashoffset="0"/>
    </svg>
  </div>
  <button class="skip-btn" id="skip-btn">Próxima série →</button>
</div>

<!-- Done overlay -->
<div class="done-overlay" id="done-overlay">
  <div class="done-icon">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
      <path d="M8 20l8 8 16-16" stroke="#3CC870" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="done-title">Treino concluído!</div>
  <div class="done-sub">Todos os exercícios de força e abdômen foram finalizados.<br>Como foi o treino?</div>
  <div class="done-stats-row">
    <div class="d-stat"><div class="d-stat-val" id="d-sets">—</div><div class="d-stat-lbl">séries</div></div>
    <div class="d-stat"><div class="d-stat-val" id="d-time">—</div><div class="d-stat-lbl">minutos</div></div>
    <div class="d-stat"><div class="d-stat-val" id="d-streak">—</div><div class="d-stat-lbl">semana</div></div>
  </div>
  <textarea class="done-note-area" id="done-note" placeholder="Anotação do treino (opcional)…"></textarea>
  <button class="done-finish-btn" id="done-finish-btn">Encerrar e salvar</button>
</div>

<script>
// ── SERVICE WORKER ──
if('serviceWorker' in navigator){
  const sw=`
self.addEventListener('install',e=>{
  e.waitUntil(caches.open('treino-v2').then(c=>c.addAll([location.href])));
  self.skipWaiting();
});
self.addEventListener('activate',e=>{ e.waitUntil(clients.claim()); });
self.addEventListener('fetch',e=>{
  if(e.request.mode==='navigate'){
    e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));
  }
});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// ── DEFAULT DATA ──
const DEFAULT_EXERCISES = [
  {id:1,name:"Prensa de Perna",      note:"Joelhos alinhados, amplitude até 90°",              sets:4,reps:"15",weight:"60 kg",phase:1},
  {id:2,name:"Cadeira Flexora",       note:"Descida controlada em 3 seg",                       sets:4,reps:"15",weight:"20 kg",phase:1},
  {id:3,name:"Puxada Alta",           note:"Barra larga, puxar até a altura do peito",          sets:4,reps:"15",weight:"30 kg",phase:1},
  {id:4,name:"Remada Baixa no Cabo",  note:"Cotovelos colados, pausa de 1 seg no final",        sets:4,reps:"15",weight:"25 kg",phase:1},
  {id:5,name:"Supino na Máquina",     note:"Empurrada horizontal — não trave o cotovelo",       sets:4,reps:"15",weight:"20 kg",phase:1},
  {id:6,name:"Cadeira Abdutora",      note:"Abre e fecha devagar, sem usar impulso",            sets:4,reps:"15",weight:"25 kg",phase:1},
  {id:7,name:"Elevação Lateral",      note:"Cotovelo levemente dobrado, não sobe acima do ombro",sets:4,reps:"15",weight:"5 kg",phase:1},
  {id:8,name:"Prancha Isométrica",    note:"Antebraços no solo, corpo reto, glúteo contraído", sets:3,reps:"30–40 seg",weight:null,phase:2},
];

// ── STATE ──
let data = {
  workout: { name:"Full Body 4×", days:"Seg / Ter / Qui / Sex", restSeconds:75, exercises:[...DEFAULT_EXERCISES] },
  sessions: {}, // { "YYYY-MM-DD": { completedSets:[], note:"", startTime, endTime } }
};

function load(){
  try{ const r=JSON.parse(localStorage.getItem('meu-treino-v2')||'{}'); if(r.workout) data=r; }catch(e){}
}
function save(){
  try{ localStorage.setItem('meu-treino-v2',JSON.stringify(data)); }catch(e){}
}
load();

// ── SESSION ──
const TODAY = new Date().toISOString().slice(0,10);
function getTodaySession(){
  if(!data.sessions[TODAY]) data.sessions[TODAY]={completedSets:data.workout.exercises.map(()=>0),note:"",startTime:Date.now(),endTime:null};
  // Ensure array length matches exercises
  const s=data.sessions[TODAY];
  while(s.completedSets.length<data.workout.exercises.length) s.completedSets.push(0);
  return s;
}

// ── TABS ──
let currentTab='hoje';
const tabs={hoje:renderHoje,semana:renderSemana,editar:renderEditar,historico:renderHistorico};

document.querySelectorAll('.nav-tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    currentTab=btn.dataset.tab;
    document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-'+currentTab).classList.add('active');
    tabs[currentTab]();
  });
});

// ── TIMER ──
let timerIv=null, timerLeft=75, timerTotal=75;
const CIRC=182.2;

function startTimer(nextName){
  stopTimer();
  timerTotal = timerLeft = data.workout.restSeconds;
  const sheet=document.getElementById('timer-sheet');
  const numEl=document.getElementById('timer-num');
  const ringEl=document.getElementById('ring-fg');
  document.getElementById('timer-sub').textContent = nextName ? 'A seguir: '+nextName : 'Último exercício!';
  sheet.classList.add('show');
  function tick(){
    numEl.textContent=timerLeft;
    ringEl.style.strokeDashoffset=CIRC*(1-timerLeft/timerTotal);
    if(timerLeft<=0){ stopTimer(); if(navigator.vibrate) navigator.vibrate([300,120,300,120,400]); return; }
    timerLeft--;
  }
  tick();
  timerIv=setInterval(tick,1000);
}
function stopTimer(){
  clearInterval(timerIv); timerIv=null;
  document.getElementById('timer-sheet').classList.remove('show');
}
document.getElementById('skip-btn').addEventListener('click',stopTimer);

// ── HOJE ──
function renderHoje(){
  const exs = data.workout.exercises;
  const sess = getTodaySession();
  const totalSets = exs.reduce((s,e)=>s+e.sets,0);
  const doneSets  = sess.completedSets.reduce((s,v)=>s+v,0);
  const doneExs   = exs.filter((_,i)=>sess.completedSets[i]>=exs[i].sets).length;

  // Header
  setHeader(
    formatDate(),
    data.workout.name,
    `<button class="bar-btn" id="reset-today-btn">Reiniciar</button>`,
    `<div class="prog-wrap"><div class="prog-track"><div class="prog-fill" style="width:${(doneSets/totalSets*100).toFixed(1)}%"></div></div><div class="prog-text">${doneExs} de ${exs.length} exercícios · ${doneSets}/${totalSets} séries</div></div>`
  );

  document.getElementById('reset-today-btn')?.addEventListener('click',()=>{
    if(!confirm('Reiniciar o treino de hoje?')) return;
    data.sessions[TODAY]={completedSets:exs.map(()=>0),note:"",startTime:Date.now(),endTime:null};
    save(); renderHoje();
  });

  // Build exercise cards
  const forca=[]; const core=[];
  exs.forEach((ex,i)=>{
    const done = sess.completedSets[i]>=ex.sets;
    const dots = Array.from({length:ex.sets},(_,s)=>{
      const cls = s<sess.completedSets[i] ? 's-done' : s===sess.completedSets[i] ? 's-next' : '';
      return `<button class="set-btn ${cls}" data-i="${i}" data-s="${s}"><span>${s+1}</span></button>`;
    }).join('');
    const card=`<div class="ex-card${done?' done':''}" id="excard-${i}">
      <div class="ex-body">
        <div class="ex-top">
          <div class="ex-name">${ex.name}</div>
          ${ex.weight?`<div class="ex-chip">${ex.weight}</div>`:''}
        </div>
        <div class="ex-note">${ex.note}</div>
        <div class="sets-row">${dots}</div>
        <div class="reps-sub">${ex.reps} por série · ${ex.sets} séries</div>
      </div></div>`;
    if(ex.phase===1) forca.push(card); else core.push(card);
  });

  document.getElementById('hoje-content').innerHTML=`
    <div class="sec-label">Fase 1 — Força</div>${forca.join('')}
    <div class="sec-label">Fase 2 — Abdômen</div>${core.join('')}
    <div class="sec-label">Fase 3 — Cardio</div>
    <div style="margin:0 14px 10px;background:var(--acb);border:1px solid var(--acd);border-radius:18px;padding:15px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:15.5px;font-weight:700">Bike ou Elíptico</span>
        <span style="font-size:17px;font-weight:800;color:var(--ac)">20–25 min</span>
      </div>
      <div style="font-size:12px;color:var(--t2)">Ritmo moderado — consegue falar frases curtas, mas não cantar</div>
    </div>`;

  document.querySelectorAll('.set-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const sess2=getTodaySession();
      const i=+btn.dataset.i, s=+btn.dataset.s;
      if(s<sess2.completedSets[i]) sess2.completedSets[i]=s;
      else if(s===sess2.completedSets[i]){
        sess2.completedSets[i]=s+1;
        const next=exs.find((_,j)=>j>i&&sess2.completedSets[j]<exs[j].sets);
        const allDone2=exs.every((_,j)=>sess2.completedSets[j]>=exs[j].sets);
        if(!allDone2) startTimer(next?.name||null);
      }
      save(); renderHoje();
      const allDone=exs.every((_,j)=>getTodaySession().completedSets[j]>=exs[j].sets);
      if(allDone && !getTodaySession().endTime) showDone();
    });
  });
}

function showDone(){
  const sess=getTodaySession();
  const exs=data.workout.exercises;
  const mins=Math.round((Date.now()-sess.startTime)/60000);
  const totalSets=exs.reduce((s,e)=>s+e.sets,0);
  document.getElementById('d-sets').textContent=totalSets;
  document.getElementById('d-time').textContent=mins;
  document.getElementById('d-streak').textContent=weekStreak()+'× esta semana';
  document.getElementById('done-note').value=sess.note||'';
  stopTimer();
  document.getElementById('done-overlay').classList.add('show');
}

document.getElementById('done-finish-btn').addEventListener('click',()=>{
  const sess=getTodaySession();
  sess.note=document.getElementById('done-note').value.trim();
  sess.endTime=Date.now();
  save();
  document.getElementById('done-overlay').classList.remove('show');
  renderHoje();
});

// ── CALENDAR ──
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
const MO_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOW_PT=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function weekStreak(){
  const now=new Date(); let count=0;
  for(let i=0;i<7;i++){
    const d=new Date(now); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    if(data.sessions[k]?.endTime) count++;
  }
  return count;
}

function renderSemana(){
  setHeader('Seu calendário','Histórico de treinos','','');
  const monthSessions=Object.keys(data.sessions).filter(k=>{
    const d=new Date(k); return d.getFullYear()===calYear && d.getMonth()===calMonth && data.sessions[k].endTime;
  });
  const totalAll=Object.values(data.sessions).filter(s=>s.endTime).length;

  let selectedDay=null;

  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=new Date().toISOString().slice(0,10);

  let daysCells='';
  for(let i=0;i<firstDay;i++) daysCells+=`<div class="cal-day"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const k=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=k===todayStr;
    const isTrained=!!(data.sessions[k]?.endTime);
    daysCells+=`<div class="cal-day${isToday?' today':''}${isTrained?' trained':''}" data-k="${k}">${d}</div>`;
  }

  document.getElementById('semana-content').innerHTML=`
    <div class="stats-row">
      <div class="stat-card"><div class="stat-val">${weekStreak()}</div><div class="stat-lbl">Esta semana</div></div>
      <div class="stat-card"><div class="stat-val">${monthSessions.length}</div><div class="stat-lbl">Este mês</div></div>
      <div class="stat-card"><div class="stat-val">${totalAll}</div><div class="stat-lbl">Total</div></div>
    </div>
    <div class="cal-header">
      <div class="cal-month">${MO_PT[calMonth]} ${calYear}</div>
      <div class="cal-nav">
        <div class="cal-arrow" id="cal-prev">‹</div>
        <div class="cal-arrow" id="cal-next">›</div>
      </div>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">${DOW_PT.map(d=>`<div class="cal-dow-cell">${d[0]}</div>`).join('')}</div>
      <div class="cal-days">${daysCells}</div>
    </div>
    <div id="cal-detail"></div>`;

  document.getElementById('cal-prev').addEventListener('click',()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderSemana(); });
  document.getElementById('cal-next').addEventListener('click',()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderSemana(); });

  document.querySelectorAll('.cal-day[data-k]').forEach(cell=>{
    cell.addEventListener('click',()=>{
      const k=cell.dataset.k;
      const sess=data.sessions[k];
      if(!sess?.endTime) return;
      const detail=document.getElementById('cal-detail');
      const d=new Date(k+'T12:00:00');
      const dateStr=`${DOW_PT[d.getDay()]}, ${d.getDate()} de ${MO_PT[d.getMonth()]}`;
      const mins=Math.round((sess.endTime-sess.startTime)/60000);
      detail.innerHTML=`<div class="cal-day-detail">
        <div class="cal-detail-date">📅 ${dateStr} · ${mins} min de treino</div>
        <div class="cal-detail-note">${sess.note||'<em style="color:var(--t3)">Sem anotação para este treino.</em>'}</div>
      </div>`;
    });
  });
}

// ── EDITAR ──
function renderEditar(){
  setHeader('Configurações','Personalizar treino','<button class="bar-btn primary" id="save-edit-btn">Salvar</button>','');
  const exs=data.workout;

  let exForms=exs.exercises.map((ex,i)=>`
    <div class="ex-edit-card" id="exedit-${i}">
      <div class="ex-edit-head">
        <span class="ex-edit-num">${i+1}</span>
        <input class="ex-edit-name-input" data-ei="${i}" data-f="name" value="${escHtml(ex.name)}" placeholder="Nome do exercício">
        <button class="del-btn" data-del="${i}" title="Remover">×</button>
      </div>
      <div class="ex-edit-fields">
        <div class="ex-edit-field">
          <div class="ex-ef-label">Séries</div>
          <input class="ex-ef-input" type="number" min="1" max="10" data-ei="${i}" data-f="sets" value="${ex.sets}">
        </div>
        <div class="ex-edit-field">
          <div class="ex-ef-label">Reps</div>
          <input class="ex-ef-input" data-ei="${i}" data-f="reps" value="${escHtml(ex.reps)}">
        </div>
        <div class="ex-edit-field">
          <div class="ex-ef-label">Peso</div>
          <input class="ex-ef-input" data-ei="${i}" data-f="weight" value="${escHtml(ex.weight||'')}">
        </div>
      </div>
    </div>`).join('');

  const restSec=data.workout.restSeconds;
  document.getElementById('editar-content').innerHTML=`
    <div class="sec-label">Nome do treino</div>
    <div class="edit-field">
      <div class="field-row">
        <div><div class="field-label">Nome</div></div>
        <input class="field-input" id="workout-name-input" value="${escHtml(exs.name)}">
      </div>
      <div class="field-row">
        <div><div class="field-label">Dias</div></div>
        <input class="field-input" id="workout-days-input" value="${escHtml(exs.days)}">
      </div>
    </div>
    <div class="sec-label">Descanso entre séries</div>
    <div class="edit-field">
      <div class="rest-row">
        <div class="rest-label-row">
          <span style="font-size:14px;font-weight:700;color:var(--t1)">Tempo de descanso</span>
          <span class="rest-val" id="rest-val-label">${restSec}s</span>
        </div>
        <input type="range" id="rest-slider" min="30" max="180" step="5" value="${restSec}">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:6px;font-weight:600">
          <span>30 seg</span><span>3 min</span>
        </div>
      </div>
    </div>
    <div class="sec-label">Exercícios</div>
    ${exForms}
    <button class="add-ex-btn" id="add-ex-btn">+ Adicionar exercício</button>`;

  document.getElementById('rest-slider').addEventListener('input',function(){
    document.getElementById('rest-val-label').textContent=this.value+'s';
  });

  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.del;
      if(data.workout.exercises.length<=1) return alert('Mínimo de 1 exercício.');
      if(!confirm(`Remover "${data.workout.exercises[i].name}"?`)) return;
      data.workout.exercises.splice(i,1);
      save(); renderEditar();
    });
  });

  document.getElementById('add-ex-btn').addEventListener('click',()=>{
    data.workout.exercises.push({
      id:Date.now(),name:"Novo exercício",note:"Observação técnica",
      sets:3,reps:"15",weight:"— kg",phase:1
    });
    save(); renderEditar();
    setTimeout(()=>document.getElementById('editar-content').lastElementChild?.previousElementSibling?.scrollIntoView({behavior:'smooth'}),100);
  });

  document.getElementById('save-edit-btn').addEventListener('click',()=>{
    data.workout.name = document.getElementById('workout-name-input').value.trim()||data.workout.name;
    data.workout.days = document.getElementById('workout-days-input').value.trim()||data.workout.days;
    data.workout.restSeconds = +document.getElementById('rest-slider').value;
    document.querySelectorAll('[data-ei]').forEach(inp=>{
      const i=+inp.dataset.ei, f=inp.dataset.f;
      if(data.workout.exercises[i]) {
        let v=inp.value.trim();
        if(f==='sets') v=Math.max(1,parseInt(v)||1);
        data.workout.exercises[i][f] = f==='weight' ? (v||null) : v;
      }
    });
    // Reset today's session exercise count alignment
    if(data.sessions[TODAY]) data.sessions[TODAY].completedSets=data.workout.exercises.map(()=>0);
    save();
    const btn=document.getElementById('save-edit-btn');
    btn.textContent='Salvo ✓'; btn.style.background='var(--acd)';
    setTimeout(()=>{btn.textContent='Salvar';btn.style.background='';},1800);
  });
}

// ── HISTÓRICO ──
function renderHistorico(){
  setHeader('Histórico','Treinos realizados','','');
  const entries=Object.entries(data.sessions)
    .filter(([,s])=>s.endTime)
    .sort(([a],[b])=>b.localeCompare(a));

  if(!entries.length){
    document.getElementById('historico-content').innerHTML=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Nenhum treino finalizado ainda.<br>Quando você encerrar o primeiro treino ele aparece aqui.</div></div>`;
    return;
  }

  const items=entries.map(([k,s])=>{
    const d=new Date(k+'T12:00:00');
    const dateStr=`${DOW_PT[d.getDay()]}, ${d.getDate()} ${MO_PT[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
    const mins=Math.round((s.endTime-s.startTime)/60000);
    const totalSets=(s.completedSets||[]).reduce((a,v)=>a+v,0);
    return `<div class="hist-item">
      <div class="hist-head" onclick="this.nextElementSibling.classList.toggle('open')">
        <div><div class="hist-date">${dateStr}</div><div class="hist-meta">${mins} min · ${totalSets} séries completadas</div></div>
        <div class="hist-badge">✓</div>
      </div>
      <div class="hist-note">${s.note||'<span style="color:var(--t3)">Sem anotação.</span>'}</div>
    </div>`;
  }).join('');

  document.getElementById('historico-content').innerHTML=items;
}

// ── HELPERS ──
function setHeader(eyebrow,title,rightHtml,extraHtml){
  document.getElementById('bar-eyebrow').textContent=eyebrow;
  document.getElementById('bar-title').textContent=title;
  document.getElementById('bar-right').innerHTML=rightHtml;
  document.getElementById('bar-extra').innerHTML=extraHtml;
}

function formatDate(){
  const d=new Date();
  return `${DOW_PT[d.getDay()]}, ${d.getDate()} de ${MO_PT[d.getMonth()]}`;
}

function escHtml(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
renderHoje();
</script>
