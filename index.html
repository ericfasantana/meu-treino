<style>
:root {
  --bg:  #0B0C0E;
  --s1:  #131416;
  --s2:  #1C1D22;
  --s3:  #26272C;
  --t1:  #F0EFE9;
  --t2:  #8F8F9A;
  --t3:  #45454E;
  --ac:  #3CC870;
  --acd: #1A5C35;
  --acb: #0A2015;
  --bd:  #1E1F24;
  --red: #E05050;
  --nav: 62px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; background: var(--bg); }
body {
  height: 100%; overflow: hidden; background: var(--bg);
  color: var(--t1); font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-size: 16px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; color-scheme: dark;
}

/* SCROLL PANELS */
.panel {
  position: fixed; top: 0; left: 0; right: 0;
  bottom: calc(var(--nav) + var(--sab));
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: none; padding-top: calc(var(--sat) + 58px); background: var(--bg);
}
.panel.active { display: block; }
.panel-content { padding: 10px 0 32px; }

/* APP BAR */
.app-bar {
  position: fixed; top: var(--sat); left: 0; right: 0; z-index: 60;
  background: var(--bg); border-bottom: 1px solid var(--bd); padding: 12px 18px;
}
.bar-row { display: flex; justify-content: space-between; align-items: center; }
.bar-eyebrow {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--ac); margin-bottom: 1px;
}
.bar-title { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.bar-btn {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 10px;
  padding: 6px 13px; color: var(--t2); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.bar-btn:active { opacity: 0.7; }
.bar-btn.primary { background: var(--ac); border-color: var(--ac); color: #fff; }

/* PROGRESS BAR */
.prog-wrap { margin-top: 10px; }
.prog-track { height: 3px; background: var(--s3); border-radius: 2px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--ac); transition: width 0.5s ease; }
.prog-text { font-size: 12px; color: var(--t2); margin-top: 6px; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav) + var(--sab)); background: var(--s1);
  border-top: 1px solid var(--bd); display: flex;
  padding-bottom: var(--sab); z-index: 60;
}
.nav-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 3px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; color: var(--t3);
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; transition: color 0.15s; user-select: none;
}
.nav-tab svg { width: 21px; height: 21px; stroke-width: 1.75; }
.nav-tab.active { color: var(--ac); }

/* DAY TABS */
.day-tabs {
  display: flex; gap: 6px; padding: 10px 14px 12px;
  overflox-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0; padding: 7px 13px; min-width: 54px;
  background: var(--s2); border: 1.5px solid var(--bd); border-radius: 12px;
  color: var(--t2); font-size: 12px; font-weight: 700; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; font-family: inherit;
  transition: all 0.15s; line-height: 1.25;
}
.day-tab.active { background: var(--ac); border-color: var(--ac); color: #fff; }
.day-tab.today:not(.active) { border-color: var(--ac); color: var(--ac); }
.day-tab:active { opacity: 0.7; }
.day-tab-sub { display: block; font-size: 9px; font-weight: 600; opacity: 0.75; margin-top: 1px; }

/* SECTION LABEL */
.sec-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--t2); padding: 14px 18px 8px;
}

/* EXERCISE CARD */
.ex-card {
  margin: 0 14px 9px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 18px; overflow: hidden; transition: opacity 0.35s, border-color 0.35s;
}
.ex-card.done { opacity: 0.42; border-color: var(--acd); }
.ex-card.done .ex-name { text-decoration: line-through; text-decoration-color: var(--acd); }
.ex-body { padding: 15px 15px 13px; }
.ex-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
.ex-name { font-size: 15.5px; font-weight: 700; flex: 1; line-height: 1.25; }
.ex-chip {
  background: var(--acb); color: var(--ac); font-size: 12.5px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.ex-note { font-size: 12px; color: var(--t2); margin-bottom: 13px; line-height: 1.4; }
.sets-row { display: flex; gap: 6px; }
.set-btn {
  flex: 1; height: 46px; border-radius: 11px; border: 2px solid var(--bd);
  background: var(--s2); color: var(--t2); font-size: 13.5px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; transition: all 0.15s;
  user-select: none; font-family: inherit; position: relative;
}
.set-btn:active { transform: scale(0.91); }
.set-btn.s-next { border-color: var(--ac); color: var(--ac); background: var(--acb); }
.set-btn.s-done { background: var(--ac); border-color: var(--ac); color: #fff; }
.set-btn.s-done::after { content: 'â'; position: absolute; font-size: 15px; }
.set-btn.s-done > * { display: none; }
.reps-sub { font-size: 11.5px; color: var(--t2); text-align: center; margin-top: 8px; font-weight: 500; }

/* TIMER SHEET */
.timer-sheet {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  background: var(--s1); border-top: 1px solid var(--bd);
  border-radius: 22px 22px 0 0; padding: 18px 22px;
  padding-bottom: calc(var(--sab) + var(--nav) + 18px);
  transform: translateY(110%); transition: transform 0.4s cubic-bezier(0.32,1.15,0.6,1);
}
.timer-sheet.show { transform: translateY(0); }
.timer-handle { width: 36px; height: 4px; background: var(--s3); border-radius: 2px; margin: 0 auto 16px; }
.timer-body { display: flex; align-items: center; gap: 18px; }
.timer-left { flex: 1; }
.timer-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--t2); }
.timer-num { font-size: 54px; font-weight: 800; color: var(--ac); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
.timer-sub { font-size: 12px; color: var(--t2); margin-top: 4px; }
.timer-ring { width: 70px; height: 70px; flex-shrink: 0; }
.ring-bg { fill: none; stroke: var(--s3); stroke-width: 5.5; }
.ring-fg { fill: none; stroke: var(--ac); stroke-width: 5.5; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }
.skip-btn {
  display: block; width: 100%; margin-top: 14px; background: var(--s2);
  border: 1px solid var(--bd); border-radius: 13px; padding: 14px;
  color: var(--t1); font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: inherit; -webkit-tap-highlight-color: transparent;
}
.skip-btn:active { opacity: 0.7; }

/* CALENDAR */
.cal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px 10px; }
.cal-month { font-size: 16px; font-weight: 800; letter-spacing: -0.2px; }
.cal-nav { display: flex; gap: 4px; }
.cal-arrow {
  width: 34px; height: 34px; background: var(--s2); border: 1px solid var(--bd);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent; font-size: 15px; color: var(--t2);
}
.cal-arrow:active { opacity: 0.6; }
.cal-grid { padding: 0 14px 6px; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.cal-dow-cell { text-align: center; font-size: 11px; font-weight: 700; color: var(--t3); padding: 4px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day {
  aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 14px; font-weight: 600; color: var(--t2);
  cursor: pointer; -webkit-tap-highlight-color: transparent; position: relative;
}
.cal-day.today { color: var(--t1); background: var(--s2); }
.cal-day.trained { background: var(--acb); color: var(--ac); font-weight: 800; }
.cal-day.trained::after {
  content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--ac);
}
.cal-day.trained.today { background: var(--acd); }
.cal-day:empty { cursor: default; }
.cal-day-detail {
  margin: 6px 14px 14px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; padding: 14px 16px;
}
.cal-detail-date { font-size: 12px; font-weight: 700; color: var(--ac); margin-bottom: 6px; }
.cal-detail-note { font-size: 14px; color: var(--t2); line-height: 1.5; }

/* STATS */
.stats-row { display: flex; padding: 0 14px 6px; gap: 8px; }
.stat-card {
  flex: 1; background: var(--s1); border: 1px solid var(--bd); border-radius: 14px;
  padding: 12px; text-align: center;
}
.stat-val { font-size: 22px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
.stat-lbl { font-size: 11px; color: var(--t2); font-weight: 600; margin-top: 1px; }

/* EDIT FORM */
.edit-field {
  margin: 0 14px 10px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; overflow: hidden;
}
.field-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--bd); gap: 12px;
}
.field-row:last-child { border-bottom: none; }
.field-label { font-size: 14px; font-weight: 600; color: var(--t1); flex-shrink: 0; }
.field-input {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 9px;
  padding: 7px 11px; color: var(--t1); font-family: inherit; font-size: 14px;
  font-weight: 600; outline: none; width: 100%; max-width: 200px; text-align: right;
}
.field-input:focus { border-color: var(--ac); }
.rest-row { padding: 14px 16px; }
.rest-label-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
.rest-val { font-size: 17px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--ac); cursor: pointer; height: 4px; }

/* EX EDIT */
.ex-edit-card {
  margin: 0 14px 9px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; overflow: hidden;
}
.ex-edit-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--bd); background: var(--s2);
}
.ex-edit-num { font-size: 12px; font-weight: 800; color: var(--ac); min-width: 20px; }
.ex-edit-name-input {
  flex: 1; background: transparent; border: none; color: var(--t1);
  font-family: inherit; font-size: 14px; font-weight: 700; outline: none; min-width: 0;
}
.ex-edit-name-input::placeholder { color: var(--t3); }
.del-btn {
  width: 28px; height: 28px; border-radius: 8px; background: transparent;
  border: 1px solid var(--bd); color: var(--red); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0; font-family: inherit;
}
.del-btn:active { opacity: 0.6; }
.ex-edit-fields { display: grid; grid-template-columns: 1fr 1fr 1fr; }
.ex-edit-field { padding: 10px 14px; border-right: 1px solid var(--bd); }
.ex-edit-field:last-child { border-right: none; }
.ex-ef-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--t3); margin-bottom: 5px; }
.ex-ef-input {
  width: 100%; background: var(--s2); border: 1px solid var(--bd); border-radius: 7px;
  padding: 6px 8px; color: var(--t1); font-family: inherit; font-size: 13px;
  font-weight: 600; outline: none; text-align: center;
}
.ex-ef-input:focus { border-color: var(--ac); }
.add-ex-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin: 4px 14px 16px; padding: 14px; background: var(--acb);
  border: 1.5px dashed var(--acd); border-radius: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; color: var(--ac);
  font-size: 14px; font-weight: 700; font-family: inherit;
}
.add-ex-btn:active { opacity: 0.7; }

/* HISTORY */
.hist-item {
  margin: 0 14px 10px; background: var(--s1); border: 1px solid var(--bd);
  border-radius: 16px; overflow: hidden;
}
.hist-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 15px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.hist-date { font-size: 13.5px; font-weight: 800; }
.hist-meta { font-size: 12px; color: var(--t2); margin-top: 2px; }
.hist-badge { background: var(--acb); color: var(--ac); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.hist-note { padding: 11px 15px 13px; font-size: 13px; color: var(--t2); line-height: 1.5; border-top: 1px solid var(--bd); display: none; }
.hist-note.open { display: block; }

/* DONE OVERLAY */
.done-overlay {
  position: fixed; inset: 0; z-index: 400; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 28px; opacity: 0; pointer-events: none; transition: opacity 0.5s;
  padding-top: calc(var(--sat) + 40px);
}
.done-overlay.show { opacity: 1; pointer-events: auto; }
.done-icon {
  width: 80px; height: 80px; border-radius: 50%; background: var(--acb);
  border: 2px solid var(--acd); display: flex; align-items: center;
  justify-content: center; margin-bottom: 22px;
}
.done-title { font-size: 28px; font-weight: 800; text-align: center; letter-spacing: -0.5px; margin-bottom: 8px; }
.done-sub { font-size: 14px; color: var(--t2); text-align: center; line-height: 1.6; margin-bottom: 28px; }
.done-stats-row {
  display: flex; gap: 20px; margin-bottom: 32px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: 18px; padding: 18px 28px;
}
.d-stat { text-align: center; }
.d-stat-val { font-size: 24px; font-weight: 800; color: var(--ac); font-variant-numeric: tabular-nums; }
.d-stat-lbl { font-size: 11px; color: var(--t2); margin-top: 2px; font-weight: 600; }
.done-note-area {
  width: 100%; max-width: 380px; background: var(--s2); border: 1px solid var(--bd);
  border-radius: 14px; padding: 13px; color: var(--t1); font-family: inherit;
  font-size: 14px; line-height: 1.5; resize: none; height: 90px; outline: none; margin-bottom: 16px;
}
.done-note-area:focus { border-color: var(--ac); }
.done-finish-btn {
  width: 100%; max-width: 380px; background: var(--ac); border: none;
  border-radius: 16px; padding: 17px; color: #fff; font-size: 17px;
  font-weight: 800; cursor: pointer; font-family: inherit; -webkit-tap-highlight-color: transparent;
}

/* EMPTY / REST */
.empty { text-align: center; padding: 48px 24px; color: var(--t2); }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-text { font-size: 14px; line-height: 1.6; }
.rest-card {
  margin: 6px 14px 14px; background: var(--s1); border: 1px solid var(--bd);

}
.rest-card-icon { font-size: 36px; margin-bottom: 10px; }
.rest-card-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.rest-card-sub { font-size: 13px; color: var(--t2); line-height: 1.6; }
</style>

// ââ CONSTANTS ââ

function load(){

  }catch(e){}
  const def=mkExercises();
  DAY_KEYS.forEach(k=>{
    if(!data.workouts[k]) data.workouts[k]={name:REST_DAYS.has(k)?'Descanso':'',restSeconds:REST_DAYS.has(k)?0:75,exercises:[]};
    if(!REST_DAYS.has(k)&&(!data.workouts[k].exercises||!data.workouts[k].exercises.length)&&def[k])
      data.workouts[k].exercises=def[k].map(e=>({...e}));
  });
}
function save(){
  try{localStorage.setItem('treino-v4',JSON.stringify(data));}catch(e){}
}

// Session key: "YYYY-MM-DD-daykey"  e.g. "2026-09-01-seg"
function sessKey(dateStr,dk){ return dateStr+'-'+dk; }

function getSession(dateStr,dk){
  const k=sessKey(dateStr,dk);
  const wk=data.workouts[dk];
  if(!data.sessions[k]){
    data.sessions[k]={workoutKey:dk,completedSets:wk.exercises.map(()=>0),note:"",startTime:Date.now(),endTime:null};
  }
  const s=data.sessions[k];
  while(s.completedSets.length<wk.exercises.length) s.completedSets.push(0);
  return s;
}

let timerIv=null,timerLeft=90,timerTotal=90;
function startTimer(nextName){
  stopTimer();
  timerTotal=timerLeft=data.workouts[activeDay].restSeconds||90;
  const sheet=document.getElementById('timer-sheet');
  const numEl=document.getElementById('timer-num');
  const ringEl=document.getElementById('ring-fg');
  document.getElementById('timer-sub').textContent=nextName?'A seguir: '+nextName:'Ãltimo exercÃ­cio!';
  sheet.classList.add('show');
  function tick(){
    numEl.textContent=timerLeft;
    ringEl.style.strokeDashoffset=CIRC*(1-timerLeft/timerTotal);
    if(timerLeft<=0){stopTimer();if(navigator.vibrate)navigator.vibrate([300,120,300,120,400]);return;}
    timerLeft--;
  }
  tick(); timerIv=setInterval(tick,1000);
}
function stopTimer(){
  clearInterval(timerIv);timerIv=null;
  document.getElementById('timer-sheet').classList.remove('show');
}

// ââ CARDIO TIMER (per day) ââ
const CS={};
DAY_KEYS.forEach(k=>CS[k]={left:CARDIO_DUR[k],running:false,done:false});
let cardioIv=null,cardioDK=null;

function pauseCardio(){
  if(cardioIv){clearInterval(cardioIv);cardioIv=null;}
  if(cardioDK) CS[cardioDK].running=false;
  cardioDK=null;
}

function buildCardioCard(dk){
  const cs=CS[dk];
  const m=Math.floor(cs.left/60),s=cs.left%60;
  const timeStr=`${m}:${String(s).padStart(2,'0')}`;
  let btnText='Iniciar',btnStyle='background:var(--ac);color:#fff';
  if(cs.done){btnText='ConcluÃ­do â';btnStyle='background:var(--acd);color:var(--ac)';}
  else if(cs.running){btnText='Pausar';btnStyle='background:var(--s3);color:var(--t1)';}
  else if(cs.left<CARDIO_DUR[dk]){btnText='Continuar';btnStyle='background:var(--ac);color:#fff';}
  const isQua=dk==='qua';
  const title=isQua?'Remo Indoor ou Caminhada':'Bike ou ElÃ­ptico';
  const hint=isQua?'Ritmo moderado â 40 a 50 min de atividade leve':'Ritmo moderado â consegue falar frases curtas, mas nÃ£o cantar';
  return `<div style="margin:0 14px 10px;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:15px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="font-size:15.5px;font-weight:700">${title}</span>
      <span id="cardio-disp" style="font-size:22px;font-weight:800;color:${cs.done?'var(--acd)':'var(--ac)'};font-variant-numeric:tabular-nums">${cs.done?'â':timeStr}</span>
    </div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:12px">${hint}</div>
    <button id="cardio-btn" style="width:100%;padding:13px;${btnStyle};border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent">${btnText}</button>
  </div>`;
}

function tickCardio(dk){
  const cs=CS[dk]; cs.left--;
  const disp=document.getElementById('cardio-disp');
  if(disp){const m=Math.floor(cs.left/60),s=cs.left%60;disp.textContent=`${m}:${String(s).padStart(2,'0')}`;}
  if(cs.left<=0){
    clearInterval(cardioIv);cardioIv=null;cs.running=false;cs.done=true;cardioDK=null;
    if(navigator.vibrate)navigator.vibrate([400,200,400,200,600]);
    const btn=document.getElementById('cardio-btn'),disp2=document.getElementById('cardio-disp');
    if(btn){btn.textContent='ConcluÃ­do â';btn.style.background='var(--acd)';btn.style.color='var(--ac)';}
    if(disp2){disp2.textContent='â';disp2.style.color='var(--acd)';}
  }
}

function toggleCardio(dk){
  const cs=CS[dk];
  if(cs.done){cs.left=CARDIO_DUR[dk];cs.done=false;cs.running=false;pauseCardio();renderHoje();return;}
  if(!cs.running){
    if(cardioDK&&cardioDK!==dk) pauseCardio();
    cs.running=true;cardioDK=dk;
    cardioIv=setInterval(()=>tickCardio(dk),1000);
    const btn=document.getElementById('cardio-btn');if(btn)btn.textContent='Pausar';
  } else {
    cs.running=false;clearInterval(cardioIv);cardioIv=null;cardioDK=null;
    const btn=document.getElementById('cardio-btn');if(btn)btn.textContent='Continuar';
  }
}

  );

  document.getElementById('reset-btn')?.addEventListener('click',()=>{

    delete data.sessions[sessKey(TODAY,dk)];

  const forca=[],core=[];
  exs.forEach((ex,i)=>{

      const cl=s<sess.completedSets[i]?'s-done':s===sess.completedSets[i]?'s-next':'';
      return `<button class="set-btn ${cl}" data-i="${i}" data-s="${s}"><span>${s+1}</span></button>`;
    }).join('');
    const card=`<div class="ex-card${done?' done':''}">
      <div class="ex-body">
        <div class="ex-top">
          <div class="ex-name">${ex.name}</div>
          ${ex.weight?`<div class="ex-chip">${ex.weight}</div>`:''}
        </div>
        <div class="ex-note">${ex.note}</div>
        <div class="sets-row">${dots}</div>
        <div class="reps-sub">${ex.reps} por sÃ©rie Â· ${ex.sets} sÃ©ries</div>
      </div></div>`;
    if(ex.phase===1) forca.push(card); else core.push(card);
  });

  const hasCore=core.length>0;
  document.getElementById('hoje-content').innerHTML=
    buildDayTabs(dk,false)+
    `<div class="sec-label">Fase 1 â ForÃ§a</div>${forca.join('')}

  bindDayTabs();
  document.getElementById('cardio-btn')?.addEventListener('click',()=>toggleCardio(dk));

  document.querySelectorAll('.set-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const sess2=getSession(TODAY,dk);
      const i=+btn.dataset.i,s=+btn.dataset.s;
      if(s<sess2.completedSets[i]){
        sess2.completedSets[i]=s;
      } else if(s===sess2.completedSets[i]){
        sess2.completedSets[i]=s+1;
        const allDone2=exs.every((_,j)=>sess2.completedSets[j]>=exs[j].sets);
        if(!allDone2){
          const curDone=sess2.completedSets[i]>=exs[i].sets;
          let nxt;
          if(!curDone) nxt=exs[i].name;
          else { const nx=exs.find((_,j)=>j>i&&sess2.completedSets[j]<exs[j].sets); nxt=nx?.name||null; }
          startTimer(nxt);

      }
      save(); renderHoje();
      if(exs.every((_,j)=>getSession(TODAY,dk).completedSets[j]>=exs[j].sets)&&!getSession(TODAY,dk).endTime)
        showDone(dk);
    });
  });
}

// ââ CALENDAR ââ
let calYear=new Date().getFullYear(),calMonth=new Date().getMonth();

function weekStreak(){
  const now=new Date();let count=0;
  for(let i=0;i<7;i++){
    const d=new Date(now);d.setDate(d.getDate()-i);
    const ds=d.toISOString().slice(0,10);
    if(Object.keys(data.sessions).some(k=>k.startsWith(ds)&&data.sessions[k].endTime)) count++;
  }
  return count;
}

function trainedDates(){
  return new Set(
    Object.keys(data.sessions)
      .filter(k=>data.sessions[k].endTime)
      .map(k=>k.slice(0,10))
  );
}

        <div class="cal-detail-note">${details||'<em style="color:var(--t3)">Sem anotaÃ§Ã£o.</em>'}</div>

}

// ââ EDITAR ââ
function renderEditar(){
  const wk=data.workouts[editDay];
  setHeader('ConfiguraÃ§Ãµes','Personalizar treino','<button class="bar-btn primary" id="save-edit-btn">Salvar</button>','');
  const exForms=wk.exercises.map((ex,i)=>`
    <div class="ex-edit-card">
      <div class="ex-edit-head">
        <span class="ex-edit-num">${i+1}</span>
        <input class="ex-edit-name-input" data-ei="${i}" data-f="name" value="${escHtml(ex.name)}" placeholder="Nome do exercÃ­cio">
        <button class="del-btn" data-del="${i}">Ã</button>
      </div>
      <div class="ex-edit-fields">
        <div class="ex-edit-field">
          <div class="ex-ef-label">SÃ©ries</div>
          <input class="ex-ef-input" type="number" min="1" max="10" data-ei="${i}" data-f="sets" value="${ex.sets}">
        </div>
        <div class="ex-edit-field">
          <div class="ex-ef-label">Reps</div>
          <input class="ex-ef-input" data-ei="${i}" data-f="reps" value="${escHtml(ex.reps)}">
        </div>
        <div class="ex-edit-field">
          <div class="ex-ef-label">Peso</div>
          <input class="ex-ef-input" data-ei="${i}" data-f="weight" value="${escHtml(ex.weight||'')}">
        </div>
      </div>
    </div>`).join('');

  document.getElementById('editar-content').innerHTML=
    buildDayTabs(editDay,true)+
    `<div class="sec-label">Descanso â ${wk.name}</div>
    <div class="edit-field">
      <div class="rest-row">
        <div class="rest-label-row">
          <span style="font-size:14px;font-weight:700;color:var(--t1)">Tempo de descanso</span>
          <span class="rest-val" id="rest-val-label">${wk.restSeconds}s</span>
        </div>
        <input type="range" id="rest-slider" min="30" max="180" step="5" value="${wk.restSeconds}">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--t3);margin-top:6px;font-weight:600"><span>30 seg</span><span>3 min</span></div>
      </div>
    </div>
    <div class="sec-label">ExercÃ­cios â ${wk.name}</div>
    ${exForms}
    <button class="add-ex-btn" id="add-ex-btn">+ Adicionar exercÃ­cio</button>`;

  document.getElementById('rest-slider').addEventListener('input',function(){
    document.getElementById('rest-val-label').textContent=this.value+'s';
  });
  document.querySelectorAll('.eday-tab').forEach(tab=>{
    tab.addEventListener('click',()=>{editDay=tab.dataset.eday;renderEditar();});
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.del;
      if(wk.exercises.length<=1)return alert('MÃ­nimo de 1 exercÃ­cio.');
      if(!confirm(`Remover "${wk.exercises[i].name}"?`))return;
      wk.exercises.splice(i,1);save();renderEditar();
    });
  });
  document.getElementById('add-ex-btn').addEventListener('click',()=>{
    wk.exercises.push({id:Date.now(),name:"Novo exercÃ­cio",note:"ObservaÃ§Ã£o tÃ©cnica",sets:3,reps:"15",weight:"â kg",phase:1});
    save();renderEditar();
    setTimeout(()=>document.getElementById('editar-content').lastElementChild?.previousElementSibling?.scrollIntoView({behavior:'smooth'}),100);
  });
  document.getElementById('save-edit-btn').addEventListener('click',()=>{
    wk.restSeconds=+document.getElementById('rest-slider').value;
    document.querySelectorAll('[data-ei]').forEach(inp=>{
      const i=+inp.dataset.ei,f=inp.dataset.f;
      if(wk.exercises[i]){
        let v=inp.value.trim();
        if(f==='sets') v=Math.max(1,parseInt(v)||1);
        wk.exercises[i][f]=f==='weight'?(v||null):v;
      }
    });
    save();
    const btn=document.getElementById('save-edit-btn');
    btn.textContent='Salvo â';btn.style.background='var(--acd)';
    setTimeout(()=>{btn.textContent='Salvar';btn.style.background='';},1800);
  });
}

// ââ HISTÃRICO ââ
function renderHistorico(){
  setHeader('HistÃ³rico','Treinos realizados','','');
  const entries=Object.entries(data.sessions)
    .filter(([,s])=>s.endTime)
    .sort(([a],[b])=>b.localeCompare(a));
  if(!entries.length){
    document.getElementById('historico-content').innerHTML=`<div class="empty"><div class="empty-icon">ð</div><div class="empty-text">Nenhum treino finalizado ainda.<br>Quando vocÃª encerrar o primeiro treino ele aparece aqui.</div></div>`;
    return;
  }
  const items=entries.map(([k,s])=>{
    const ds=k.slice(0,10);
    const d=new Date(ds+'T12:00:00');
    const dateStr=`${DOW_PT[d.getDay()]}, ${d.getDate()} ${MO_PT[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
    const mins=Math.round((s.endTime-s.startTime)/60000);
    const totalSets=(s.completedSets||[]).reduce((a,v)=>a+v,0);
    const wkName=s.workoutKey?data.workouts[s.workoutKey]?.name||'':'';
    return `<div class="hist-item">
      <div class="hist-head" onclick="this.nextElementSibling.classList.toggle('open')">
        <div>
          <div class="hist-date">${dateStr}${wkName?` Â· ${wkName}`:''}</div>
          <div class="hist-meta">${mins} min Â· ${totalSets} sÃ©ries</div>
        </div>
        <div class="hist-badge">â</div>
      </div>
      <div class="hist-note">${s.note||'<span style="color:var(--t3)">Sem anotaÃ§Ã£o.</span>'}</div>
    </div>`;
  }).join('');
  document.getElementById('historico-content').innerHTML=items;
}

// ââ HELPERS ââ
function setHeader(ey,ti,rh,ex){
  document.getElementById('bar-eyebrow').textContent=ey;
  document.getElementById('bar-title').textContent=ti;
  document.getElementById('bar-right').innerHTML=rh;
  document.getElementById('bar-extra').innerHTML=ex;
}
function formatDate(){
  const d=new Date();
  return `${DOW_PT[d.getDay()]}, ${d.getDate()} de ${MO_PT[d.getMonth()]}`;
}
function escHtml(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
